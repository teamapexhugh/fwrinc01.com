<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>羽球 AR 球場</title><style>body{margin:0;background:#07111d;color:#fff;font-family:-apple-system,sans-serif}main{max-width:720px;margin:auto;padding:16px}.stage{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:20px;background:#12253d}video,canvas{position:absolute;width:100%;height:100%;object-fit:cover}video{opacity:0}button{margin:10px 5px 0 0;padding:13px;border:0;border-radius:12px;background:#51e3ad;color:#07111d;font-weight:700;font-size:15px}#s{color:#b7c9dc;font-size:14px}</style><main><h2>🏸 羽球 AR 球場</h2><p>人物保留在虛擬球場與觀眾台前方</p><div class="stage"><video id="v" playsinline muted></video><canvas id="c"></canvas></div><button id="go">啟動後鏡頭</button><button onclick="night=!night">切換夜場</button><p id="s">請用 iPhone Safari 開啟並允許相機。</p></main><script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script><script>let v=document.querySelector('#v'),c=document.querySelector('#c'),x=c.getContext('2d'),s=document.querySelector('#s'),night=false;function world(w,h){let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,night?'#03081b':'#59a9de');g.addColorStop(.45,night?'#15244b':'#d8edff');g.addColorStop(.46,'#28364a');g.addColorStop(1,'#071013');x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle=night?'#171933':'#aab4c4';for(let y=h*.18;y<h*.48;y+=h*.05){for(let z=0;z<w;z+=w*.055){x.fillRect(z+(y/h)*18,y,w*.025,h*.016)}}x.fillStyle='#243b4b';x.fillRect(0,h*.43,w,h*.07);x.fillStyle=night?'#1c7358':'#38a77a';x.beginPath();x.moveTo(w*.12,h);x.lineTo(w*.88,h);x.lineTo(w*.67,h*.49);x.lineTo(w*.33,h*.49);x.fill();x.strokeStyle='#f5fbff';x.lineWidth=Math.max(2,w*.006);x.beginPath();x.moveTo(w*.12,h);x.lineTo(w*.88,h);x.lineTo(w*.67,h*.49);x.lineTo(w*.33,h*.49);x.closePath();x.moveTo(w*.5,h);x.lineTo(w*.5,h*.49);x.moveTo(w*.29,h*.82);x.lineTo(w*.71,h*.82);x.stroke();x.strokeStyle='#f8f8f8';x.lineWidth=3;x.beginPath();x.moveTo(0,h*.63);x.lineTo(w,h*.63);x.stroke();x.fillStyle='rgba(255,244,170,.8)';for(let a=.12;a<.95;a+=.25){x.beginPath();x.arc(w*a,h*.09,13,0,7);x.fill()}}let m=new SelfieSegmentation({locateFile:a=>'https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/'+a});m.setOptions({modelSelection:1});m.onResults(r=>{let w=c.width,h=c.height;x.clearRect(0,0,w,h);x.drawImage(r.segmentationMask,0,0,w,h);x.globalCompositeOperation='source-in';x.drawImage(r.image,0,0,w,h);x.globalCompositeOperation='destination-over';world(w,h);x.globalCompositeOperation='source-over'});go.onclick=async()=>{try{let q=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});v.srcObject=q;await v.play();c.width=v.videoWidth;c.height=v.videoHeight;s.textContent='AR 球場已啟動。';go.disabled=true;(async function f(){await m.send({image:v});requestAnimationFrame(f)})()}catch(e){s.textContent='無法啟動相機，請確認 Safari、HTTPS 與權限。'}};</script>
