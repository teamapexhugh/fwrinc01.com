<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>羽球 AR 濾鏡</title><style>body{margin:0;background:#08121f;color:#fff;font-family:-apple-system,sans-serif}main{max-width:720px;margin:auto;padding:18px}h1{font-size:22px}.stage{position:relative;aspect-ratio:3/4;border-radius:20px;overflow:hidden;background:#172b42}video,canvas{position:absolute;width:100%;height:100%;object-fit:cover}video{opacity:0}button,label{border:0;border-radius:12px;padding:13px;margin:8px 4px 0 0;background:#52e0aa;color:#07121e;font-weight:bold;font-size:15px}label{display:inline-block;background:#233b55;color:#fff}input{display:none}#s{color:#b8c9da;font-size:14px}</style><main><h1>🏸 羽球 AR 背景濾鏡</h1><p>後鏡頭優先｜保留人物｜即時替換背景</p><div class="stage"><video id="v" playsinline muted></video><canvas id="c"></canvas></div><button id="go">啟動後鏡頭</button><button onclick="bg='#1464c0'">藍色</button><button onclick="bg='#111'">黑色</button><button onclick="bg='#eee'">白色</button><label>選背景照片<input id="f" type="file" accept="image/*"></label><p id="s">請在 iPhone Safari 的 HTTPS 網址開啟，並允許相機。</p></main><script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script><script>let bg='#1464c0',im,v=document.querySelector('#v'),c=document.querySelector('#c'),x=c.getContext('2d'),go=document.querySelector('#go'),s=document.querySelector('#s');let m=new SelfieSegmentation({locateFile:a=>'https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/'+a});m.setOptions({modelSelection:1});m.onResults(r=>{let w=c.width,h=c.height;x.clearRect(0,0,w,h);x.drawImage(r.segmentationMask,0,0,w,h);x.globalCompositeOperation='source-in';x.drawImage(r.image,0,0,w,h);x.globalCompositeOperation='destination-over';if(im){let z=Math.max(w/im.width,h/im.height);x.drawImage(im,(w-im.width*z)/2,(h-im.height*z)/2,im.width*z,im.height*z)}else{x.fillStyle=bg;x.fillRect(0,0,w,h)}x.globalCompositeOperation='source-over'});go.onclick=async()=>{try{let st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});v.srcObject=st;await v.play();c.width=v.videoWidth;c.height=v.videoHeight;s.textContent='人物分割已啟動。';go.disabled=true;(async function q(){await m.send({image:v});requestAnimationFrame(q)})()}catch(e){s.textContent='無法啟動相機：請確認 HTTPS、Safari 與相機權限。'}};f.onchange=e=>{im=new Image;im.onload=()=>s.textContent='已套用相簿背景。';im.src=URL.createObjectURL(e.target.files[0])}</script>
