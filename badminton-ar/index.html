<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>羽球 AR 球場</title><style>body{margin:0;background:#07111d;color:#fff;font-family:-apple-system,sans-serif}main{max-width:720px;margin:auto;padding:16px}.stage{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:20px;background:#172c42}video,canvas{position:absolute;width:100%;height:100%;object-fit:cover}video{opacity:0}button,label{display:inline-block;border:0;border-radius:12px;padding:13px;margin:9px 5px 0 0;background:#51e3ad;color:#07111d;font-weight:700;font-size:15px}label{background:#28435b;color:#fff}input{display:none}#s{color:#bfd0df;font-size:14px}</style><main><h2>🏸 羽球 AR 球場</h2><p>預設：原場地＋70% 透明 AR 球場</p><div class="stage"><video id="v" playsinline muted loop></video><canvas id="c"></canvas></div><button id="cam">啟動後鏡頭</button><label>上傳手機影片測試<input id="file" type="file" accept="video/*"></label><button id="mode">切換：完整虛擬場</button><button id="motion">啟動 AR 動態視角</button><p id="s">可直接選 iPhone 相簿影片測試，不需要在球場。</p></main><script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script><script>let v=document.querySelector('#v'),c=document.querySelector('#c'),x=c.getContext('2d'),f=document.createElement('canvas'),fx=f.getContext('2d'),hybrid=true,px=0,py=0,go=false,s=document.querySelector('#s');function court(w,h,a=.7){x.save();x.globalAlpha=a;x.fillStyle='#16896a';x.beginPath();x.moveTo(w*.1,h);x.lineTo(w*.9,h);x.lineTo(w*.67,h*.52);x.lineTo(w*.33,h*.52);x.fill();x.strokeStyle='#eaffff';x.lineWidth=Math.max(2,w*.006);x.beginPath();x.moveTo(w*.1,h);x.lineTo(w*.9,h);x.lineTo(w*.67,h*.52);x.lineTo(w*.33,h*.52);x.closePath();x.moveTo(w*.5,h);x.lineTo(w*.5,h*.52);x.moveTo(w*.27,h*.82);x.lineTo(w*.73,h*.82);x.stroke();x.restore()}function scene(w,h){let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#103766');g.addColorStop(.48,'#172337');g.addColorStop(.49,'#111923');g.addColorStop(1,'#061013');x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle='#a9b5c5';for(let y=h*.18;y<h*.48;y+=h*.05)for(let z=0;z<w;z+=w*.06)x.fillRect(z,y,w*.025,h*.015);court(w,h,1)}function hud(w,h){x.save();x.translate(px*w*.001,py*h*.001);x.fillStyle='rgba(5,18,38,.8)';x.fillRect(w*.28,h*.14,w*.44,h*.09);x.strokeStyle='#58f5d2';x.lineWidth=2;x.strokeRect(w*.28,h*.14,w*.44,h*.09);x.fillStyle='#58f5d2';x.font='bold '+Math.max(15,w*.04)+'px sans-serif';x.textAlign='center';x.fillText('AR MATCH  00 : 00',w*.5,h*.20);x.restore()}let m=new SelfieSegmentation({locateFile:a=>'https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/'+a});m.setOptions({modelSelection:1});m.onResults(r=>{let w=c.width,h=c.height;x.clearRect(0,0,w,h);if(hybrid){x.drawImage(r.image,0,0,w,h);court(w,h,.7)}else scene(w,h);f.width=w;f.height=h;fx.clearRect(0,0,w,h);fx.drawImage(r.image,0,0,w,h);fx.globalCompositeOperation='destination-in';fx.drawImage(r.segmentationMask,0,0,w,h);fx.globalCompositeOperation='source-over';x.drawImage(f,0,0);hud(w,h)});async function run(){if(go)return;go=true;await v.play();c.width=v.videoWidth;c.height=v.videoHeight;s.textContent=hybrid?'透明 AR 地板已啟動。':'完整虛擬場景已啟動。';(async function loop(){if(!go)return;await m.send({image:v});requestAnimationFrame(loop)})()}cam.onclick=async()=>{try{v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});run()}catch(e){s.textContent='請允許相機權限。'}};file.onchange=e=>{let z=e.target.files[0];if(!z)return;go=false;v.srcObject=null;v.src=URL.createObjectURL(z);v.onloadeddata=run;s.textContent='正在載入你的影片…'};mode.onclick=()=>{hybrid=!hybrid;mode.textContent=hybrid?'切換：完整虛擬場':'切換：透明 AR 地板';s.textContent=hybrid?'已選透明 AR 地板（建議）。':'已選完整虛擬場。'};motion.onclick=async()=>{try{if(DeviceOrientationEvent.requestPermission)await DeviceOrientationEvent.requestPermission();addEventListener('deviceorientation',e=>{px=e.gamma||0;py=e.beta||0});motion.textContent='AR 動態視角已開啟'}catch(e){s.textContent='未允許動作感測。'}};</script>
